name: Play.Hosting 24/7 Keeper (Azure Cloud IP)

on:
  schedule:
    # Berjalan tiap 15 menit otomatis via GitHub Actions scheduler
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: play-hosting-keeper
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Show Azure Public IP
        run: |
          echo "Connecting via GitHub Azure Datacenter IP:"
          curl -s https://api.ipify.org || true
          echo ""

      - name: Install Mineflayer
        run: npm install mineflayer@4.39.0

      - name: Run Play.Hosting Minecraft Keeper (Direct Azure IP)
        run: |
          KEEPALIVE_MINUTES=12 node scripts/play_hosting_keeper.js
        env:
          MC_HOST: cirobro.play.hosting
          MC_PORT: 25565
