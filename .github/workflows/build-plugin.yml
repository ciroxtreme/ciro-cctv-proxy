name: Build Minecraft Traffic Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-plugin/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        working-directory: ./minecraft-plugin
        run: mvn clean package --no-transfer-progress

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CiroTrafficSentinel-plugin
          path: minecraft-plugin/target/*.jar

      - name: Release Plugin to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-plugin
          name: Ciro Traffic Sentinel Paper Plugin
          files: minecraft-plugin/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
